name: Build and test SSH executor

on:
  push:
    branches: ['**', '!pr@**', '!repr@**']
    paths:
      - Dockerfile
      - .dockerignore
      - requirements-runtime.txt
      - pyproject.toml
      - Makefile
      - '*.c'
      - '*.py'
      - config/**
      - src/**
      - tests/**
      - .github/workflows/build.yml
      - .github/image_tag.py
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    outputs:
      branch_tag: ${{ steps.image.outputs.tag }}
    env:
      TEST_IMAGE: jumpserver-executor:local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select branch image tag
        id: image
        if: github.repository == 'jumpserver/ansible-executor' && github.ref_type == 'branch' && github.event_name != 'pull_request'
        run: |
          tag=$(python3 .github/image_tag.py)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install SDK and test client
        run: python3 -m pip install . 'ansible-runner==2.4.0'
      - name: Check task paths and reject unsafe event and artifact streams
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux OpenSSH test image and check NSS
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: jumpserver-executor-ssh:test
          cache-from: type=gha,scope=executor-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=executor-${{ matrix.arch }}
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.TEST_IMAGE }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Check NSS with memory sanitizers
        run: >-
          docker run --rm --network none --entrypoint /bin/sh
          jumpserver-executor-ssh:test -c
          'make clean && make check CFLAGS="-O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"'
      - name: Run SSH and Ansible integration tests
        env:
          JMS_EXECUTOR_TEST_IMAGE: ${{ env.TEST_IMAGE }}
        run: python3 tests/integration.py
      - name: Run native SDK against upstream Runner
        env:
          JMS_EXECUTOR_TEST_IMAGE: ${{ env.TEST_IMAGE }}
        run: python3 tests/sdk_integration.py
      - name: Check JumpServer Runner fork compatibility
        env:
          JMS_EXECUTOR_TEST_IMAGE: ${{ env.TEST_IMAGE }}
        run: |
          python3 -m pip install --no-deps https://github.com/jumpserver-dev/ansible-runner/archive/refs/tags/v2.4.0.2.zip
          python3 tests/sdk_integration.py
      - name: Install crane
        run: |
          arch=$(uname -m)
          [[ "$arch" != aarch64 ]] || arch=arm64
          archive="go-containerregistry_Linux_$arch.tar.gz"
          url=https://github.com/google/go-containerregistry/releases/download/v0.21.6
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 "$url/$archive" -o "$archive"
          curl -fsSL --retry 3 "$url/checksums.txt" -o crane-checksums.txt
          grep " $archive\$" crane-checksums.txt | sha256sum --check -
          tar -xzf "$archive" crane
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check digest-only publishing against a local registry
        run: python3 tests/publish_integration.py
      - name: Log in to Docker Hub
        if: github.repository == 'jumpserver/ansible-executor' && github.ref_type == 'branch' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the tested image by digest
        if: github.repository == 'jumpserver/ansible-executor' && github.ref_type == 'branch' && github.event_name != 'pull_request'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          archive="$RUNNER_TEMP/executor.tar"
          trap 'rm -f "$archive"' EXIT
          docker save "$TEST_IMAGE" -o "$archive"
          digest=$(crane digest --tarball "$archive")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p image-digests
          crane push "$archive" "docker.io/jumpserver/ansible-executor@$digest" \
            --image-refs "image-digests/$ARCH"
      - uses: actions/upload-artifact@v4
        if: github.repository == 'jumpserver/ansible-executor' && github.ref_type == 'branch' && github.event_name != 'pull_request'
        with:
          name: executor-digest-${{ matrix.arch }}
          path: image-digests/*
          overwrite: true

  publish:
    needs: integration
    if: github.repository == 'jumpserver/ansible-executor' && github.ref_type == 'branch' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRANCH_IMAGE: jumpserver/ansible-executor:${{ needs.integration.outputs.branch_tag }}
      MIRROR_IMAGE: registry.fit2cloud.com/jumpserver/ansible-executor:${{ needs.integration.outputs.branch_tag }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: executor-digest-*
          path: image-digests
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: registry.fit2cloud.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - name: Publish tested multi-architecture branch image
        run: |
          docker buildx imagetools create -t "$BRANCH_IMAGE" --metadata-file manifest.json \
            "$(cat image-digests/amd64)" "$(cat image-digests/arm64)"
          digest=$(jq -er '."containerimage.descriptor".digest' manifest.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="docker.io/jumpserver/ansible-executor@$digest"
          docker buildx imagetools inspect "$image" --raw | jq -e \
            '([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64", "arm64"]'
          docker buildx imagetools create -t "$MIRROR_IMAGE" "$image"
          [[ "$(docker buildx imagetools inspect "$MIRROR_IMAGE" --format '{{.Manifest.Digest}}')" == "$digest" ]]
          printf '%s\n' "$image" > ansible-executor-image.txt
          printf 'Branch image: `%s`\n\nMirror image: `%s`\n\nSource commit: `%s`\n\nPinned image: `%s`\n' \
            "$BRANCH_IMAGE" "$MIRROR_IMAGE" "$GITHUB_SHA" "$image" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ansible-executor-image
          path: ansible-executor-image.txt
          overwrite: true
