name: Build and test SSH executor

on:
  push:
    branches: ['**', '!pr@**', '!repr@**']
    paths:
      - Dockerfile
      - .dockerignore
      - requirements-runtime.txt
      - pyproject.toml
      - Makefile
      - '*.c'
      - '*.py'
      - config/**
      - src/**
      - tests/**
      - .github/workflows/build.yml
      - .github/image_tag.py
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    outputs:
      branch_image: ${{ steps.image.outputs.name }}
    env:
      CANDIDATE: jumpserver/ansible-executor:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select branch image tag
        id: image
        if: github.repository == 'jumpserver/ansible-executor' && github.ref_type == 'branch' && github.event_name != 'pull_request'
        run: |
          tag=$(python3 .github/image_tag.py)
          echo "name=jumpserver/ansible-executor:$tag" >> "$GITHUB_OUTPUT"
      - name: Install SDK and test client
        run: python3 -m pip install . 'ansible-runner==2.4.0'
      - name: Check task paths and reject unsafe event and artifact streams
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build Linux OpenSSH test image and check NSS
        run: docker build --target test -t jumpserver-executor-ssh:test .
      - name: Build production image
        run: >-
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA"
          -t "$CANDIDATE" .
      - name: Check NSS with memory sanitizers
        run: >-
          docker run --rm --network none --entrypoint /bin/sh
          jumpserver-executor-ssh:test -c
          'make clean && make check CFLAGS="-O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"'
      - name: Run SSH and Ansible integration tests
        env:
          JMS_EXECUTOR_TEST_IMAGE: ${{ env.CANDIDATE }}
        run: python3 tests/integration.py
      - name: Run native SDK against upstream Runner
        env:
          JMS_EXECUTOR_TEST_IMAGE: ${{ env.CANDIDATE }}
        run: python3 tests/sdk_integration.py
      - name: Check JumpServer Runner fork compatibility
        env:
          JMS_EXECUTOR_TEST_IMAGE: ${{ env.CANDIDATE }}
        run: |
          python3 -m pip install --no-deps https://github.com/jumpserver-dev/ansible-runner/archive/refs/tags/v2.4.0.2.zip
          python3 tests/sdk_integration.py
      - name: Log in to Docker Hub
        if: github.repository == 'jumpserver/ansible-executor' && github.ref_type == 'branch' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the tested image
        if: github.repository == 'jumpserver/ansible-executor' && github.ref_type == 'branch' && github.event_name != 'pull_request'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker push "$CANDIDATE"
          digest=$(docker buildx imagetools inspect "$CANDIDATE" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p image-digests
          printf 'docker.io/jumpserver/ansible-executor@%s\n' "$digest" > "image-digests/$ARCH"
      - uses: actions/upload-artifact@v4
        if: github.repository == 'jumpserver/ansible-executor' && github.ref_type == 'branch' && github.event_name != 'pull_request'
        with:
          name: executor-digest-${{ matrix.arch }}
          path: image-digests/*
          overwrite: true

  publish:
    needs: integration
    if: github.repository == 'jumpserver/ansible-executor' && github.ref_type == 'branch' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CANDIDATE: jumpserver/ansible-executor:build-${{ github.run_id }}-${{ github.run_attempt }}
      BRANCH_IMAGE: ${{ needs.integration.outputs.branch_image }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: executor-digest-*
          path: image-digests
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested multi-architecture candidate
        run: |
          docker buildx imagetools create -t "$CANDIDATE" \
            "$(cat image-digests/amd64)" "$(cat image-digests/arm64)"
          digest=$(docker buildx imagetools inspect "$CANDIDATE" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="docker.io/jumpserver/ansible-executor@$digest"
          docker buildx imagetools inspect "$image" --raw | jq -e \
            '([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64", "arm64"]'
          docker buildx imagetools create -t "$BRANCH_IMAGE" "$image"
          printf '%s\n' "$image" > ansible-executor-image.txt
          printf 'Branch image: `%s`\n\nCandidate: `%s`\n\nSource commit: `%s`\n\nPinned image: `%s`\n' \
            "$BRANCH_IMAGE" "$CANDIDATE" "$GITHUB_SHA" "$image" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ansible-executor-image
          path: ansible-executor-image.txt
          overwrite: true
